name: test

on:
  push:
    paths:
      - 'code/rewrite/**'
      - '.github/workflows/test.yml'
  pull_request:
    paths:
      - 'code/rewrite/**'
      - '.github/workflows/test.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run production system tests
        run: |
          g++ -std=c++17 -Wall -Wextra \
            code/rewrite/production_system.cpp \
            code/rewrite/demo.cpp \
            -o demo_production
          ./demo_production

      - name: Build and run threat system tests
        run: |
          g++ -std=c++17 -Wall -Wextra \
            code/rewrite/threat_system.cpp \
            code/rewrite/demo_threat.cpp \
            -o demo_threat
          ./demo_threat
